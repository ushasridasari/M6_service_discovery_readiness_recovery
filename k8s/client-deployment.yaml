apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-client
  template:
    metadata:
      labels:
        app: inventory-client
    spec:
      containers:
        - name: client
          image: inventory-client:1.0
          imagePullPolicy: Never
